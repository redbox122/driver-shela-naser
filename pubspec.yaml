name: shellafood_delivery
description: A new Flutter application.
publish_to: "none" #
version: 1.2.0+26

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.0.6
  connectivity_plus: ^6.1.4
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  path_provider: ^2.0.10
  pin_code_fields: ^8.0.1
  http: ^1.2.1
  flutter_switch: ^0.3.2
  shimmer_animation: ^2.0.0
  geolocator: ^14.0.0
  geocoding: ^4.0.0
  google_maps_flutter: ^2.0.6
  vibration: ^3.1.3
  image_picker: ^1.0.7
  disable_battery_optimization: ^1.1.2
  phone_numbers_parser: ^9.0.3
  country_code_picker: ^3.0.0
  audioplayers: ^6.4.0
  flutter_widget_from_html: ^0.15.1
  cached_network_image: ^3.3.0
  path: ^1.8.1
  http_parser: ^4.0.2
  intl: ^0.20.2
  dotted_border: ^3.1.0
  photo_view: ^0.15.0
  web_socket_channel: ^3.0.3
  flutter_inappwebview: ^6.0.0
  just_the_tooltip: ^0.0.12
  url_launcher: ^6.3.1
  flutter_local_notifications: ^20.0.0
  video_player: ^2.9.5
  play_install_referrer: ^0.5.0

  # نظام الاتصال الداخلي (Agora RTC) — إضافة جديدة، لا تمسّ ما سبق
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/
    - assets/notification.mp3

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900
