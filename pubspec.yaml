name: shellafood_delivery
description: A new Flutter application.
publish_to: 'none' #
version: 1.1.0+14

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.0.6
  connectivity_plus: ^6.1.4
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  path_provider: ^2.0.10
  url_strategy: ^0.3.0
  pin_code_fields: ^8.0.1
  http: ^1.2.1
  flutter_switch: ^0.3.2
  shimmer_animation: ^2.0.0
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.0.6
  vibration: ^3.1.3
  image_picker: ^1.0.7
  disable_battery_optimization: ^1.1.2
  phone_numbers_parser: ^9.0.3
  country_code_picker: ^3.0.0
  audioplayers: ^6.4.0
  flutter_html: ^3.0.0-alpha.5
  cached_network_image: ^3.3.0
  win32: ^5.2.0
  path: ^1.8.1
  http_parser: ^4.0.2
  intl: ^0.20.2
  dotted_border: ^2.0.0+1
  photo_view: ^0.15.0
  web_socket_channel: ^3.0.3
  flutter_inappwebview: ^6.0.0
  just_the_tooltip: ^0.0.12
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.1.0
  video_player: ^2.9.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/
    - assets/notification.mp3

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900